format: proprietary
note: >-
  MGID does not use RFC 9457 problem+json. Errors are returned as a proprietary
  JSON envelope with a single `errors` key holding an array of bracketed
  SCREAMING_SNAKE_CASE code strings, e.g. {"errors":["[ERROR_CAMPAIGN_DOES_NOT_EXIST]"]}.
  The agency surface returns human-readable sentences on the same `errors` key
  instead of coded strings, so the envelope is consistent across surfaces but the
  payload vocabulary is not. Codes below are transcribed verbatim from the
  published reference pages; MGID publishes no separate error-reference page, no
  numeric class scheme, and no remediation text — the code string is the whole
  contract. `[ERROR_RESOURCE_NOT_FOUND]` was also observed live on an
  unauthenticated GET to https://api.mgid.com/v1/campaigns on 2026-08-12.
envelope:
  shape: '{"errors": ["[CODE]"]}'
  field: errors
  type: array
  code_style: bracketed SCREAMING_SNAKE_CASE
  message_field: null
  request_id_field: null
  type_uri: false
  interpolation:
    - token: '%'
      meaning: server-substituted numeric threshold, e.g. [ERROR_MINIMAL_DAILY_BUDGET_LIMIT_IS_%]
    - token: '{max_allowed_limit}'
      meaning: server-substituted page-size ceiling, e.g. [ERROR_MAX_LIMIT_PER_PAGE_{max_allowed_limit}]
    - token: parameter_name
      meaning: server-substituted parameter name, e.g. [ERROR_NOT_VALID_parameter_name]
status_codes:
  - status: 200
    meaning: OK
    surfaces: [advertiser, publisher, agency]
  - status: 400
    meaning: Bad Request — syntax error in the request
    surfaces: [publisher]
  - status: 401
    meaning: Unauthorized — invalid or missing token
    surfaces: [advertiser, publisher, agency]
    observed: true
  - status: 404
    meaning: Not Found — item not found
    surfaces: [advertiser, publisher]
    observed: true
  - status: 422
    meaning: Unprocessable Entity — invalid parameters
    surfaces: [publisher]
