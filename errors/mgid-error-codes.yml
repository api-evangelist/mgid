agency_messages:
  note: >-
    The agency (RA) surface returns prose rather than bracketed codes on the same
    `errors` key. Transcribed verbatim from https://help.mgid.com/api-ra.
  messages:
    - invalid token
    - Invalid client id
    - The amount of money in the account is less than what you are trying to transfer
    - Account (client, amount) is not specified
gaps:
  - No RFC 9457 application/problem+json representation.
  - No stable type URI, documentation link or remediation text per code.
  - No request/correlation id on the error envelope, so failures are not traceable to a support case.
  - No published mapping from code string to HTTP status.
  - Agency surface uses prose messages while advertiser/publisher use code strings.
