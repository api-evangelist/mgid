note: >-
  MGID's standards posture is entirely on the ad-tech side of the house — IAB
  frameworks and Prebid — and almost absent on the API side. The REST APIs
  conform to no cross-cutting API standard beyond plain HTTP. No SOC 2, ISO
  27001, PCI DSS, HIPAA or FedRAMP certification is published anywhere on
  mgid.com; there is no trust centre (trust.mgid.com does not resolve) and
  www.mgid.com/security is a soft 404 that returns the SPA shell with 404 body
  content. No `Compliance` pointer is emitted, because no compliance program is
  published.
